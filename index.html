<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1120">
  <meta name="description" content="Track, analyze, and manage all your Bybit USDT/NGN P2P trades with real-time P&L, fee tracking, and bank account management.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P2P Tracker">
  
  <title>Bybit NGN P2P Trade Tracker</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Ambient background glow effects -->
  <div class="ambient-glow glow-top-left" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom-right" aria-hidden="true"></div>

  <!-- App Shell -->
  <div class="app-shell" id="app-shell">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-badge">
            <i data-lucide="arrow-left-right" class="brand-icon"></i>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">Bybit P2P <span class="brand-tag">NGN</span></h1>
            <p class="brand-subtitle">USDT Journal & P&L Tracker</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="btn-sync-status" title="Local Storage Synchronized" aria-label="Sync Status">
            <span class="status-dot"></span>
            <i data-lucide="hard-drive"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Views Mount Target -->
    <main class="main-content" id="main-content">
      <!-- Views mounted dynamically via js/views/*.view.js -->
    </main>

    <!-- Bottom Navigation Bar (Mobile-First) -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main Navigation">
      <button class="nav-tab active" data-target="dashboard" id="tab-dashboard" aria-label="Dashboard">
        <div class="nav-icon-box">
          <i data-lucide="layout-dashboard"></i>
        </div>
        <span class="nav-label">Dashboard</span>
        <span class="active-indicator"></span>
      </button>

      <button class="nav-tab" data-target="add-trade" id="tab-add-trade" aria-label="Add Trade">
        <div class="nav-icon-box nav-icon-add">
          <i data-lucide="plus"></i>
        </div>
        <span class="nav-label">Record</span>
        <span class="active-indicator"></span>
      </button>

      <button class="nav-tab" data-target="history" id="tab-history" aria-label="History">
        <div class="nav-icon-box">
          <i data-lucide="history"></i>
        </div>
        <span class="nav-label">History</span>
        <span class="active-indicator"></span>
      </button>

      <button class="nav-tab" data-target="settings" id="tab-settings" aria-label="Settings">
        <div class="nav-icon-box">
          <i data-lucide="settings-2"></i>
        </div>
        <span class="nav-label">Settings</span>
        <span class="active-indicator"></span>
      </button>
    </nav>

    <!-- Global Modals & Toast Containers -->
    <div id="modals-container"></div>
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
