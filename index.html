<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1A">
  <meta name="description" content="Track, analyze, and manage all your Bybit USDT/NGN P2P trades with real-time P&L, fee tracking, and bank account management.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P2P Tracker">
  
  <title>Bybit NGN P2P Trade Tracker</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/styles.css?v=2.2">
</head>
<body>
  <!-- Ambient Background Glows -->
  <div class="ambient-glow glow-top-left"></div>
  <div class="ambient-glow glow-bottom-right"></div>

  <div class="app-shell" id="app-shell">
    
    <!-- Desktop Sidebar Navigation -->
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main Navigation">
      <div class="sidebar-brand">
        <div class="brand-badge">
          <i data-lucide="arrow-left-right" class="brand-icon"></i>
        </div>
        <div>
          <div class="brand-title">P2P Tracker <span class="brand-tag">NGN</span></div>
          <div class="brand-subtitle">USDT Journal</div>
        </div>
      </div>
      <div class="sidebar-nav-items">
        <button class="sidebar-nav-item active" data-target="dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </button>
        <button class="sidebar-nav-item" data-target="add-trade">
          <i data-lucide="plus-circle"></i>
          <span>Record Trade</span>
        </button>
        <button class="sidebar-nav-item" data-target="history">
          <i data-lucide="history"></i>
          <span>Trade History</span>
        </button>
        <button class="sidebar-nav-item" data-target="settings">
          <i data-lucide="settings-2"></i>
          <span>Settings</span>
        </button>
      </div>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="btn-theme-toggle-sidebar" title="Toggle theme" aria-label="Toggle light/dark mode">
          <i data-lucide="sun" class="icon-sun"></i>
          <i data-lucide="moon" class="icon-moon"></i>
        </button>
      </div>
    </nav>

    <!-- Main content wrapper (offset by sidebar on desktop) -->
    <div class="app-main-wrapper">
      <!-- Mobile Header -->
      <header class="app-header">
        <div class="header-content">
          <div class="brand">
            <div class="brand-badge">
              <i data-lucide="arrow-left-right" class="brand-icon"></i>
            </div>
            <div class="brand-text">
              <h1 class="brand-title">P2P Tracker <span class="brand-tag">NGN</span></h1>
            </div>
          </div>
          <div class="header-actions">
            <button class="theme-toggle" id="btn-theme-toggle" title="Toggle theme" aria-label="Toggle light/dark mode">
              <i data-lucide="sun" class="icon-sun"></i>
              <i data-lucide="moon" class="icon-moon"></i>
            </button>
            <button class="btn-icon" id="btn-sync-status" title="Local Storage" aria-label="Sync Status">
              <span class="status-dot"></span>
              <i data-lucide="hard-drive"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Views -->
      <main class="main-content" id="main-content">
        <!-- Views mounted dynamically -->
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main Navigation">
      <button class="nav-tab active" data-target="dashboard" id="tab-dashboard" aria-label="Dashboard">
        <div class="nav-icon-box">
          <i data-lucide="layout-dashboard"></i>
        </div>
        <span class="nav-label">Dashboard</span>
        <span class="active-indicator"></span>
      </button>
      <button class="nav-tab" data-target="add-trade" id="tab-add-trade" aria-label="Record Trade">
        <div class="nav-icon-box nav-icon-add">
          <i data-lucide="plus"></i>
        </div>
        <span class="nav-label">Trade</span>
        <span class="active-indicator"></span>
      </button>
      <button class="nav-tab" data-target="history" id="tab-history" aria-label="History">
        <div class="nav-icon-box">
          <i data-lucide="history"></i>
        </div>
        <span class="nav-label">History</span>
        <span class="active-indicator"></span>
      </button>
      <button class="nav-tab" data-target="settings" id="tab-settings" aria-label="Settings">
        <div class="nav-icon-box">
          <i data-lucide="settings-2"></i>
        </div>
        <span class="nav-label">Settings</span>
        <span class="active-indicator"></span>
      </button>
    </nav>

    <!-- Modal containers -->
    <div id="modals-container"></div>
    <div id="confirm-modal-container"></div>
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
