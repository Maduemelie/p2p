<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Accent Circles -->
  <circle cx="160" cy="160" r="100" fill="#3B82F6" opacity="0.18" filter="url(#glow)"/>
  <circle cx="350" cy="350" r="100" fill="#10B981" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Center Icon: P2P Arrows & Currency Emblem -->
  <g transform="translate(106, 106)">
    <!-- Rounded Inner Shield -->
    <rect width="300" height="300" rx="60" fill="rgba(18, 28, 47, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

    <!-- Buy Arrow (Green - Realized) -->
    <path d="M 60 110 L 190 110 M 150 70 L 190 110 L 150 150" fill="none" stroke="url(#greenGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sell Arrow (Blue - P2P Flow) -->
    <path d="M 240 190 L 110 190 M 150 150 L 110 190 L 150 230" fill="none" stroke="url(#blueGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- USDT / NGN Token Badges -->
    <circle cx="215" cy="110" r="24" fill="#10B981"/>
    <text x="215" y="117" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">₦</text>

    <circle cx="85" cy="190" r="24" fill="#3B82F6"/>
    <text x="85" y="117" transform="translate(0, 79)" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
